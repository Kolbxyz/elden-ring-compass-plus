name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Setup Node.js (for Nitro server snapshot)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web application
        env:
          GITHUB_PAGES: 'true'
        run: |
          bun run build

      - name: Prepare static output
        run: |
          # Spin up the built Nitro production server to capture the prerendered HTML shell
          PORT=3008 node apps/web/.output/server/index.mjs &
          SERVER_PID=$!
          sleep 4

          # Capture the full prerendered HTML
          curl -fsSL http://localhost:3008/ > apps/web/.output/public/index.html
          kill $SERVER_PID 2>/dev/null || true

          mkdir -p build-pages
          cp -r apps/web/.output/public/* build-pages/

          # GitHub Pages SPA support:
          # 1. .nojekyll disables Jekyll processing for underscore-prefixed asset dirs
          touch build-pages/.nojekyll
          # 2. 404.html fallback allows client-side routing (TanStack Router) to handle direct URLs
          cp build-pages/index.html build-pages/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-pages/

      - name: Deploy to GitHub Pages (Actions Mode)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to gh-pages branch (Branch Mode)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build-pages
          publish_branch: gh-pages
          cname: ''
