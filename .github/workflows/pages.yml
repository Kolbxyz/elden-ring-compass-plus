name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web application
        env:
          GITHUB_PAGES: 'true'
          NITRO_PRESET: 'github-pages'
        run: |
          # Build dependent packages and the web application
          bun run build

      - name: Prepare static output
        run: |
          # Locate the static output directory
          if [ -d "apps/web/.output/public" ]; then
            OUT_DIR="apps/web/.output/public"
          elif [ -d ".output/public" ]; then
            OUT_DIR=".output/public"
          elif [ -d "apps/web/dist" ]; then
            OUT_DIR="apps/web/dist"
          else
            echo "Error: Could not locate build output directory"
            find . -maxdepth 3 -name ".output" -o -name "dist"
            exit 1
          fi

          echo "Found build output at: $OUT_DIR"
          mkdir -p build-pages
          cp -r "$OUT_DIR"/* build-pages/

          # GitHub Pages SPA support:
          # 1. .nojekyll disables Jekyll processing for underscore-prefixed asset dirs
          touch build-pages/.nojekyll
          # 2. 404.html fallback allows client-side routing (TanStack Router) to handle direct URLs
          if [ -f "build-pages/index.html" ] && [ ! -f "build-pages/404.html" ]; then
            cp build-pages/index.html build-pages/404.html
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-pages/

      - name: Deploy to GitHub Pages (Actions Mode)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to gh-pages branch (Branch Mode)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build-pages
          publish_branch: gh-pages
          cname: ''
